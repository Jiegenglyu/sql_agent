services:
  postgres:
    image: postgres:16-alpine
    container_name: sql-agent-demo-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_READONLY_USER: ${POSTGRES_READONLY_USER}
      POSTGRES_READONLY_PASSWORD: ${POSTGRES_READONLY_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - demo_postgres_data:/var/lib/postgresql/data
      - ./backend/demo_db/init.sh:/docker-entrypoint-initdb.d/001-init.sh:ro
      - ./backend/demo_db/init.sql:/tmp/sql-agent-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  demo_postgres_data:
